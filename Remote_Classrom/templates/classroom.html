<!DOCTYPE html>
<html>
<head>
    <title>Live Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
        }
        .card-custom {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            color: white;
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
        }
        iframe {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container-fluid mt-4">

    <h2 class="text-center mb-4">Live Classroom</h2>

    <div class="row">

        <!-- VIDEO SECTION -->
        <div class="col-lg-8 mb-4">
            <div class="card card-custom p-3 shadow">
                <h5>Live Session</h5>

                <!-- ✅ FIXED JITSI ROOM NAME -->
                <iframe
                    src="https://meet.jit.si/RemoteClassroom_{{ class_id }}_Secure2026_ABC123"
                    width="100%"
                    height="450"
                    allow="camera; microphone; fullscreen; display-capture">
                </iframe>

            </div>
        </div>

        <!-- RIGHT SIDE PANEL -->
        <div class="col-lg-4">

            <!-- CHAT -->
            <div class="card card-custom p-3 mb-4 shadow">
                <h5>Live Chat</h5>

                <div id="messages" class="chat-box mb-3"></div>

                <div class="input-group">
                    <input id="message" class="form-control" placeholder="Type message...">
                    <button class="btn btn-light" onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- FILE UPLOAD -->
            <div class="card card-custom p-3 mb-4 shadow">
                <h5>Share Content</h5>
                <form method="POST" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control mb-2">
                    <button class="btn btn-light w-100">Upload</button>
                </form>
            </div>

            <!-- LEADERBOARD -->
            <div class="card card-custom p-3 shadow">
                <h5>Participation Leaderboard</h5>
                <ul class="list-group list-group-flush">
                    {% for l in leaderboard %}
                    <li class="list-group-item bg-transparent text-white d-flex justify-content-between">
                        <span>Student {{ l[1] }}</span>
                        <span>Score: {{ l[4] }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>

        </div>
    </div>

</div>

<script>
    var socket = io();

    function sendMessage(){
        var msgInput = document.getElementById("message");
        var msg = msgInput.value;
        if(msg.trim() !== ""){
            socket.send(msg);
            msgInput.value = "";
        }
    }

    socket.on("message", function(msg){
        var div = document.createElement("div");
        div.innerHTML = "<div class='mb-2'><strong>User:</strong> " + msg + "</div>";
        document.getElementById("messages").appendChild(div);
        document.getElementById("messages").scrollTop = 9999;
    });
</script>

</body>
</html>
