<!DOCTYPE html>
<html>
<head>
    <title>Remote Classroom - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            color: white;
        }
        input {
            background: rgba(255,255,255,0.2) !important;
            border: none !important;
            color: white !important;
        }
        input::placeholder {
            color: #ddd !important;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="card glass-card p-5 shadow-lg" style="width: 400px;">
    <h2 class="text-center mb-4">Remote Classroom</h2>

    <form method="POST">
        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" required>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <button class="btn btn-light w-100">Login</button>
    </form>

    <div class="text-center mt-3">
        <a href="/register" class="text-white">Create Account</a>
    </div>
</div>

</body>
</html>
