<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Remote Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f2027;
            background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
            color: white;
        }
        .card-custom {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            color: white;
        }
        .navbar {
            background: rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand">Remote Classroom</span>
    <span>Welcome, {{ session['name'] }}</span>
</nav>

<div class="container mt-5">

    <!-- Teacher Section -->
    {% if session['role'] == 'teacher' %}
    <div class="card card-custom p-4 mb-4 shadow">
        <h4>Create New Class</h4>
        <form method="POST" class="d-flex gap-2 mt-3">
            <input type="text" name="class_name" class="form-control" placeholder="Enter Class Name" required>
            <button class="btn btn-light">Create</button>
        </form>
    </div>
    {% endif %}

    <!-- Classes List -->
    <h3 class="mb-4">Available Classes</h3>

    <div class="row">
        {% for c in classes %}
        <div class="col-md-4 mb-4">
            <div class="card card-custom p-4 shadow">
                <h5>{{ c[1] }}</h5>
                <p>Class Code: <strong>{{ c[2] }}</strong></p>
                <a href="/classroom/{{ c[0] }}" class="btn btn-outline-light w-100">
                    Enter Classroom
                </a>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
